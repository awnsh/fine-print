<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Fine Print</title>
  <defs>
    <clipPath id="lens">
      <circle cx="76" cy="68" r="19"/>
    </clipPath>
    <g id="lines">
      <rect x="40" y="40" width="40" height="6" rx="3" fill="#CFC4B0"/>
      <rect x="40" y="52" width="46" height="6" rx="3" fill="#CFC4B0"/>
      <rect x="40" y="64" width="42" height="8" rx="4" fill="#FF4A3D"/>
      <rect x="40" y="78" width="30" height="6" rx="3" fill="#CFC4B0"/>
      <rect x="40" y="90" width="38" height="6" rx="3" fill="#CFC4B0"/>
    </g>
  </defs>

  <!-- tile -->
  <rect width="128" height="128" rx="28" fill="#1D1B24"/>

  <!-- page with folded corner -->
  <path d="M32 18 H80 L98 36 V104 a6 6 0 0 1 -6 6 H32 a6 6 0 0 1 -6 -6 V24 a6 6 0 0 1 6 -6 Z" fill="#FFF5E1"/>
  <path d="M80 18 V30 a6 6 0 0 0 6 6 H98 Z" fill="#E6D8BE"/>

  <use href="#lines"/>

  <!-- magnifier: lens shows the highlighted clause, enlarged -->
  <circle cx="76" cy="68" r="19" fill="#FFF5E1"/>
  <g clip-path="url(#lens)">
    <g transform="translate(76 68) scale(1.7) translate(-76 -68)">
      <use href="#lines"/>
    </g>
  </g>
  <circle cx="76" cy="68" r="19" fill="none" stroke="#FFB21E" stroke-width="8"/>
  <line x1="90" y1="82" x2="106" y2="98" stroke="#FFB21E" stroke-width="11" stroke-linecap="round"/>
</svg>
